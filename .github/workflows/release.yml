name: Build All Linux Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # 1. Arch Linux
  build-arch:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - name: Install Dependencies
        # -d في makepkg يتجاوز الاعتماديات (dkms/scrcpy ليست لازمة للبناء)
        run: pacman -Syu --noconfirm git rust gtk4
      - uses: actions/checkout@v4
      - name: Build Package
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          ver=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          # مجلد منفصل: makepkg يستخدم src/ وسيتعارض مع src/ الخاص بالمشروع
          mkdir /tmp/pkg
          git archive --prefix="PhoneCam-Studio-${ver}/" -o "/tmp/pkg/phonecam-studio-${ver}.tar.gz" HEAD
          cp PKGBUILD /tmp/pkg/
          useradd -m builder
          chown -R builder:builder /tmp/pkg
          su builder -c "cd /tmp/pkg && makepkg -d --noconfirm"
          cp /tmp/pkg/*.pkg.tar.zst "$GITHUB_WORKSPACE"/
      - name: Upload Arch Artifact
        uses: actions/upload-artifact@v4
        with:
          name: arch-package
          path: '*.pkg.tar.zst'

  # 2. Fedora RPM
  build-fedora:
    runs-on: ubuntu-latest
    container:
      image: fedora:latest
    steps:
      - name: Install Dependencies
        run: dnf install -y git rpm-build cargo rust gcc gtk4-devel pkgconf-pkg-config tar gzip
      - uses: actions/checkout@v4
      - name: Build RPM
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          ver=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          mkdir -p ~/rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          git archive --prefix="PhoneCam-Studio-${ver}/" -o ~/rpmbuild/SOURCES/phonecam-studio-${ver}.tar.gz HEAD
          rpmbuild -ba phonecam-spec.spec
          cp ~/rpmbuild/RPMS/*/*.rpm "$GITHUB_WORKSPACE"/
      - name: Upload Fedora Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fedora-package
          path: '*.rpm'

  # 3. Debian / Ubuntu DEB
  build-debian:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Dependencies
        # Rust مثبّت مسبقاً على runner؛ لا نثبّت cargo القديم من apt
        run: sudo apt-get update && sudo apt-get install -y build-essential fakeroot debhelper libgtk-4-dev libglib2.0-dev
      - name: Build DEB
        # -d: تجاوز فحص Build-Depends لـ cargo/rustc (نستخدم نسخة rustup)
        run: |
          dpkg-buildpackage -us -uc -b -d
          mv ../phonecam-studio*.deb .
      - name: Upload Debian Artifact
        uses: actions/upload-artifact@v4
        with:
          name: debian-package
          path: '*.deb'

  # 4. AppImage
  # ملاحظة: مكتبات GTK4 غير مضمّنة، فالحزمة تحتاج GTK4 مثبّتاً على النظام.
  build-appimage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libglib2.0-dev wget
      - name: Build Binary
        run: cargo build --release --locked
      - name: Make AppImage
        env:
          ARCH: x86_64
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage

          mkdir -p AppDir/usr/bin
          cp target/release/phonecam-studio AppDir/usr/bin/
          cp appimage/AppRun AppDir/AppRun
          chmod +x AppDir/AppRun
          cp appimage/phonecam-studio.desktop AppDir/
          cp appimage/phonecam-studio.png AppDir/
          cp appimage/phonecam-studio.png AppDir/.DirIcon

          ./appimagetool-x86_64.AppImage AppDir PhoneCam_Studio-x86_64.AppImage
      - name: Upload AppImage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: appimage-package
          path: '*.AppImage'
