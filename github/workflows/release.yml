name: Build All Linux Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # 1. بناء حزمة Arch Linux
  build-arch:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - uses: actions/checkout@v4
      - name: Install Dependencies
        run: pacman -Syu --noconfirm git rust cargo gtk4 v4l-utils scrcpy v4l2loopback-dkms
      - name: Build Package
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder .
          su - builder -c "cd $GITHUB_WORKSPACE && makepkg -s --noconfirm"
      - name: Upload Arch Artifact
        uses: actions/upload-artifact@v4
        with:
          name: arch-package
          path: '*.pkg.tar.zst'

  # 2. بناء حزمة Fedora RPM
  build-fedora:
    runs-on: fedora:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Dependencies
        run: dnf install -y rpm-build rpmdevtools cargo rust gtk4-devel v4l-utils make
      - name: Build RPM
        run: |
          mkdir -p ~/rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          cargo build --release
          rpmbuild -ba phonecam-spec.spec
      - name: Upload Fedora Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fedora-package
          path: '~/rpmbuild/RPMS/**/*.rpm'

  # 3. بناء حزمة Debian DEB
  build-debian:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cargo libgtk-4-dev libglib2.0-dev debhelper
      - name: Build DEB
        run: dpkg-buildpackage -us -uc -b
      - name: Upload Debian Artifact
        uses: actions/upload-artifact@v4
        with:
          name: debian-package
          path: '../phonecam-studio*.deb'

  # 4. بناء AppImage عالمي
  build-appimage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust & GTK
        run: sudo apt-get update && sudo apt-get install -y cargo libgtk-4-dev libglib2.0-dev wget
      - name: Build Binary
        run: cargo build --release
      - name: Make AppImage
        run: |
          wget https://github.com/probonopd/go-appimage/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/256x256/apps
          cp target/release/phonecam_studio AppDir/usr/bin/
          cp appimage/phonecam-studio.desktop AppDir/usr/share/applications/
          cp appimage/phonecam-studio.png AppDir/usr/share/icons/hicolor/256x256/apps/
          cp appimage/phonecam-studio.png AppDir/.DirIcon
          
          ./appimagetool-x86_64.AppImage AppDir PhoneCam_Studio-x86_64.AppImage
      - name: Upload AppImage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: appimage-package
          path: '*.AppImage'